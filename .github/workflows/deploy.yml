# Name of the workflow
name: Deploy Backend to Heroku


on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: "DEBUG: Validate Heroku secrets"
        shell: bash
        run: |
          set -euo pipefail
          missing=false
          [ -z "${{ secrets.HEROKU_APP_NAME }}" ] && echo "::error::HEROKU_APP_NAME is not set" && missing=true
          [ -z "${{ secrets.HEROKU_API_KEY }}" ] && echo "::error::HEROKU_API_KEY is not set" && missing=true
          [ -z "${{ secrets.HEROKU_EMAIL }}" ] && echo "::error::HEROKU_EMAIL is not set" && missing=true
          if [ "$missing" = true ]; then
            exit 1
          fi
          echo "::notice::Heroku secrets are present. Proceeding to deploy."

      - uses: actions/checkout@v2
      - name: Install Heroku CLI # <- IMPORTANT!!! Make sure the cli is installed before using the action
        run: |
          curl https://cli-assets.heroku.com/install.sh | sh 
      - uses: akhileshns/heroku-deploy@v3.14.15 # This is the action
        with:
          heroku_api_key: ${{secrets.HEROKU_API_KEY}}
          heroku_app_name: "gpa-horizon" #Must be unique in Heroku
          heroku_email: "asmitaagarwal4@gmail.com"