# Name of the workflow
name: Deploy Backend to Heroku


on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: "DEBUG: Validate Heroku secrets"
        shell: bash
        run: |
          set -euo pipefail
          missing=false
          [ -z "${{ secrets.HEROKU_APP_NAME }}" ] && echo "::error::HEROKU_APP_NAME is not set" && missing=true
          [ -z "${{ secrets.HEROKU_API_KEY }}" ] && echo "::error::HEROKU_API_KEY is not set" && missing=true
          [ -z "${{ secrets.HEROKU_EMAIL }}" ] && echo "::error::HEROKU_EMAIL is not set" && missing=true
          if [ "$missing" = true ]; then
            exit 1
          fi
          echo "::notice::Heroku secrets are present. Proceeding to deploy."

      - name: "DEB: Print App Name"
        shell: bash
        run: |
          echo "::notice::Heroku app name: ${{ vars.HEROKU_APP_NAME }}"
          echo "::notice::If this appears masked, store the app name in a repository variable instead of a secret."

      - name: "DEBUG: Print App Name"
        run: |
          echo "App Name Value: [${{ secrets.HEROKU_APP_NAME }}]"

      - name: Deploy to Heroku
        uses: akhileshns/heroku-deploy@v3.13.15
        with:
          heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
          heroku_app_name: ${{ vars.HEROKU_APP_NAME }}
          heroku_email: ${{ secrets.HEROKU_EMAIL }}
          appdir: "backend"